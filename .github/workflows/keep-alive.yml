# Streamlit Community Cloud のアプリがスリープしないよう、定期的にブラウザでアクセスする。
# 事前に GitHub リポジトリの Settings → Secrets and variables → Actions → Variables に
# STREAMLIT_APP_URL（例: https://xxx.streamlit.app）を登録すること。
name: Keep Streamlit app awake

on:
  schedule:
    # 6時間ごと（UTC）。Streamlit のスリープ猶予（約12時間）より十分短くする。
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python scripts/keep_alive.py
