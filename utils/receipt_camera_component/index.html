<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --max-h: 480px; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: sans-serif; }
  /* 映像の上にボタンを重ねるためのステージ */
  #stage { position: relative; min-height: 200px; border-radius: 8px; overflow: hidden; background: #000; }
  video, #photo {
    width: 100%; max-height: var(--max-h); display: block;
    /* 縦長映像でも高さを収める。cover だとプレビューと撮影画像がズレるので contain */
    object-fit: contain; background: #000;
  }
  /* 撮影ボタン類を映像の下端に重ねる（ネイティブのカメラアプリ風） */
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center; gap: 20px;
    padding: 14px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }
  #controls button {
    cursor: pointer; border: none; color: #fff; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  #shoot {
    width: 68px; height: 68px; border-radius: 50%;
    background: #fff; border: 4px solid rgba(255,255,255,0.5);
    box-shadow: 0 0 0 3px #ff4b4b inset, 0 2px 8px rgba(0,0,0,0.4);
    font-size: 26px;
  }
  #shoot:active { transform: scale(0.94); }
  #retake {
    padding: 12px 20px; border-radius: 999px; font-weight: bold;
    background: rgba(255,255,255,0.92); color: #333;
  }
  #flip {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; font-size: 20px;
    background: rgba(0,0,0,0.45);
  }
  #err { color: #d00; padding: 8px 0; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="err" class="hidden"></div>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="photo" class="hidden" alt="captured receipt"/>
  <div id="controls">
    <button id="shoot" type="button" title="撮影">📸</button>
    <button id="retake" type="button" class="hidden">↩️ 撮り直す</button>
    <button id="flip" type="button" title="カメラ切替">🔄</button>
  </div>
</div>
<script>
// Streamlit カスタムコンポーネント プロトコル（streamlit-component-lib 相当を素で実装）
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }
function setHeight() { send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 }); }

// プレビューの高さ上限を親ページ（Streamlit）の画面高さから決める。
// 見出し・入力方法のラジオ・下の余白ぶんを差し引き、極端な値にならないよう丸める。
function updateMaxHeight() {
  var parentH = 0;
  try { parentH = window.parent.innerHeight || 0; } catch (e) { parentH = 0; }
  var h = parentH ? parentH - 260 : 480;
  h = Math.max(240, Math.min(h, 640));
  document.documentElement.style.setProperty("--max-h", h + "px");
  setTimeout(setHeight, 50);
}

var stream = null;
var facing = "environment"; // レシート撮影が目的なのでアウトカメラを既定にする
var video = document.getElementById("video");
var photo = document.getElementById("photo");
var shoot = document.getElementById("shoot");
var retake = document.getElementById("retake");
var flip = document.getElementById("flip");
var err = document.getElementById("err");

function stopStream() {
  if (stream) {
    stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  }
}

function startStream() {
  stopStream();
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  }).then(function (s) {
    stream = s;
    video.srcObject = s;
    err.classList.add("hidden");
    setTimeout(setHeight, 300);
  }).catch(function (e) {
    err.textContent = "カメラを起動できませんでした（" + e.name + "）。ブラウザのカメラ許可を確認するか、「画像を選ぶ」を使ってください。";
    err.classList.remove("hidden");
    setTimeout(setHeight, 100);
  });
}

shoot.addEventListener("click", function () {
  var w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) { return; }
  // API送信用に長辺1568px・JPEGに縮小してから送る（websocket負荷の抑制）
  var MAX = 1568;
  var scale = Math.min(1, MAX / Math.max(w, h));
  var c = document.createElement("canvas");
  c.width = Math.round(w * scale);
  c.height = Math.round(h * scale);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  var dataUrl = c.toDataURL("image/jpeg", 0.85);
  photo.src = dataUrl;
  photo.classList.remove("hidden");
  video.classList.add("hidden");
  shoot.classList.add("hidden");
  flip.classList.add("hidden");
  retake.classList.remove("hidden");
  stopStream();
  setValue(dataUrl);
  setTimeout(setHeight, 100);
});

retake.addEventListener("click", function () {
  photo.classList.add("hidden");
  video.classList.remove("hidden");
  retake.classList.add("hidden");
  shoot.classList.remove("hidden");
  flip.classList.remove("hidden");
  setValue(null);
  startStream();
});

flip.addEventListener("click", function () {
  facing = (facing === "environment") ? "user" : "environment";
  startStream();
});

video.addEventListener("loadedmetadata", setHeight);
photo.addEventListener("load", setHeight);
window.addEventListener("resize", updateMaxHeight);
window.addEventListener("orientationchange", updateMaxHeight);

send("streamlit:componentReady", { apiVersion: 1 });
updateMaxHeight();
startStream();
</script>
</body>
</html>
